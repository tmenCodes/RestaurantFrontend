<!-- ======= Chefs Section ======= -->
<section id="chefs" class="chefs section-bg">
  <div class="container" data-aos="fade-up">
    <div class="section-header">
      <h2>Chefs</h2>
      <p>Our <span>Professional</span> Chefs</p>
    </div>

    <div class="row gy-4">
      @for (chef of chefs; track chef.name) {
      <div
        class="col-lg-4 col-md-6 d-flex align-items-stretch"
        data-aos="fade-up"
        [attr.data-aos-delay]="($index + 1) * 100"
      >
        <article class="chef-member">
          <div class="member-img">
            <img
              [src]="'./assets/img/chefs/' + chef.image"
              class="img-fluid"
              [alt]="chef.alt"
              loading="lazy"
            />
          </div>
          <div class="member-info">
            <h4>{{ chef.name }}</h4>
            <span>{{ chef.role }}</span>
            <p>{{ chef.bio }}</p>
          </div>
        </article>
      </div>
      }
    </div>
  </div>
</section>
<!-- End Chefs Section -->
