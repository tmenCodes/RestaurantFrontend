<body class="text-center" >
  <form class="form-signin" [formGroup]="SignUpForm">
    <img class="mb-4" src="./assets/img/yum.jpg" alt="" width="72" height="72">
    <h1 class="h3 mb-3 font-weight-normal">Create an Account</h1>


    <input type="fullname" id="fullName" class="form-control" placeholder="Full Name" formControlName="FullName" [ngStyle]="{'margin': '10px'}">
    <input type="username" id="username" class="form-control" placeholder="User Name" formControlName="UserName" [ngStyle]="{'margin': '10px'}">
    <input type="email" id="email" class="form-control" placeholder="Email" formControlName="Email" [ngStyle]="{'margin': '10px'}">
    <!-- <span *ngIf="Email && Email?.invalid && Email?.touched">Email</span> -->
    @if (SignUpForm.get('Email')?.hasError('EmailDuplicate')) {
      <div class>Email has already been taken!</div>
    }
    <input type="password" id="inputPassword" class="form-control" placeholder="Password"  formControlName="Password" [ngStyle]="{'margin': '10px'}">
    @if (Password && Password.invalid && Password.touched) {
      <span>Please enter a valid Password </span>
    }



    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Remember me
      </label>
    </div>


    <button class="btn btn-lg btn-primary btn-block" type="submit" [disabled]="SignUpForm.invalid" (click)="SubmitSignUp()">Create Account</button>

    <p class="mt-5 mb-3 text-muted"></p>
  </form>


</body>
