<section class="confirm-section">
  <div class="confirm-container">

    <div class="confirm-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <p class="confirm-subtitle">Thank You</p>
    <h1 class="confirm-title">Order Confirmed</h1>
    <div class="confirm-divider"></div>

    <div class="confirm-card">
      <p class="confirm-message">Your order is being prepared fresh for you!</p>

      <div class="confirm-pickup">
        <span class="pickup-label">Estimated Pickup</span>
        <span class="pickup-time">30 min &mdash; {{ calcTime }}</span>
      </div>

      <p class="confirm-disclaimer">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        This is a mock website — no real order was placed.
      </p>
    </div>

    <a routerLink="/menu" class="btn-confirm-back">
      Back to Menu
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
      </svg>
    </a>

  </div>
</section>
