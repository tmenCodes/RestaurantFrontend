<main class="login-page">
  <form
    [formGroup]="loginForm"
    class="form-signin"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    <img
      class="login-logo"
      src="./assets/img/yum.jpg"
      alt=""
      width="72"
      height="72"
    />
    <h1 class="login-title">Login To Your Account</h1>

    @if (errorMessage) {
    <div class="login-error" role="alert">{{ errorMessage }}</div>
    }

    <div class="form-field">
      <label for="login-email" class="visually-hidden">Email</label>
      <input
        id="login-email"
        type="email"
        class="form-control"
        placeholder="Email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="email.invalid && email.touched"
        aria-describedby="login-email-error"
      />
      @if (email.invalid && email.touched) {
      <span id="login-email-error" class="field-error" role="alert">
        Please enter a valid email address.
      </span>
      }
    </div>

    <div class="form-field">
      <label for="login-password" class="visually-hidden">Password</label>
      <input
        id="login-password"
        type="password"
        class="form-control"
        placeholder="Password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="password.invalid && password.touched"
        aria-describedby="login-password-error"
      />
      @if (password.invalid && password.touched) {
      <span id="login-password-error" class="field-error" role="alert">
        Please enter your password.
      </span>
      }
    </div>

    <p class="signup-prompt">
      New to Yummy? <a routerLink="/signup">Sign Up</a>
    </p>

    <button class="login-submit" type="submit" [disabled]="submitting">
      {{ submitting ? "Signing in…" : "Log In" }}
    </button>
  </form>
</main>
